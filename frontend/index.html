<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>List</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin: 0 0 4px; }
  .count { font-size: 13px; color: #888; margin: 0 0 24px; }
  .row { display: flex; gap: 8px; margin-bottom: 20px; }
  input {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    outline: none;
  }
  input:focus { border-color: #999; }
  button.add {
    width: 40px; height: 40px;
    border: none; border-radius: 6px;
    background: #1a1a1a; color: #fff;
    font-size: 18px; cursor: pointer;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid #eee;
    font-size: 14px; color: #1a1a1a;
  }
  li button {
    border: none; background: transparent; color: #bbb;
    cursor: pointer; font-size: 15px; width: 28px; height: 28px; border-radius: 5px;
  }
  li button:hover { color: #d33; background: #fdecec; }
  .empty { font-size: 13px; color: #aaa; text-align: center; padding: 24px 0; }
  .error { font-size: 13px; color: #d33; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>List</h1>
    <p class="count" id="count">Loading...</p>
    <div class="row">
      <input id="input" placeholder="Add a new item..." />
      <button class="add" id="addBtn">+</button>
    </div>
    <div id="errorBox"></div>
    <ul id="list"></ul>
  </div>

<script>
  // Backend address — change if you host it elsewhere
  const API_URL = "http://localhost:8000";

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const inputEl = document.getElementById("input");
  const errorBox = document.getElementById("errorBox");

  function showError(msg) {
    errorBox.innerHTML = `<p class="error">${msg}</p>`;
  }

  function clearError() {
    errorBox.innerHTML = "";
  }

  async function loadItems() {
    try {
      const res = await fetch(`${API_URL}/items`);
      if (!res.ok) throw new Error("Failed to fetch data");
      const items = await res.json();
      render(items);
      clearError();
    } catch (e) {
      countEl.textContent = "";
      showError("Can't connect to the backend. Make sure the server is running.");
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} ${items.length === 1 ? "item" : "items"}`;
    if (items.length === 0) {
      listEl.innerHTML = `<p class="empty">Nothing here yet. Add your first item above.</p>`;
      return;
    }
    listEl.innerHTML = items
      .map(
        (item) => `
        <li>
          <span>${escapeHtml(item.text)}</span>
          <button onclick="removeItem(${item.id})">✕</button>
        </li>`
      )
      .join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function addItem() {
    const text = inputEl.value.trim();
    if (!text) return;
    try {
      const res = await fetch(`${API_URL}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("Failed to add item");
      inputEl.value = "";
      await loadItems();
    } catch (e) {
      showError("Couldn't add the item.");
    }
  }

  async function removeItem(id) {
    try {
      const res = await fetch(`${API_URL}/items/${id}`, { method: "DELETE" });
      if (!res.ok) throw new Error("Failed to delete item");
      await loadItems();
    } catch (e) {
      showError("Couldn't delete the item.");
    }
  }

  document.getElementById("addBtn").addEventListener("click", addItem);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });

  loadItems();
</script>
</body>
</html>
