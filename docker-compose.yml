services:
  db:
    image: postgres:16-alpine

    ports: 
      -  5432:5432

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - UVICORN_RELOAD=true
    volumes:
      - .:/app
    tty: true

  frontend:
    build: ./frontend
    ports: 
      - "8080:80"

volumes:
  dbdata: